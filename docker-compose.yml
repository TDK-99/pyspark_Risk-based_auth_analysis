services:
  spark-master:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-master.sh
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - .:/app:z
    ports:
      - "8080:8080"
      - "7077:7077"

  jupyter:
    build:
      dockerfile: Dockerfile.jupyter
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    volumes:
      - .:/app:z
      -  ./ivy-cache:/tmp/.ivy2:z
    ports:
      - "8888:8888"
    depends_on:
      - spark-master

  spark-worker-1:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 1  --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master

  spark-worker-2:   
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 1  --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on: 
      - spark-master

  spark-worker-3:   
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 1  --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on: 
      - spark-master

  spark-worker-4:   
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 1  --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on: 
      - spark-master

